spring.application.name=backend
server.port=8080

# Use H2 directly without activating any other profile
spring.datasource.url=jdbc:postgresql://localhost:5435/eventknow
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging configurations
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
logging.level.org.springframework.jdbc=WARN
logging.level.org.postgresql=WARN

# Google Gemini API configurations
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.6-flash
